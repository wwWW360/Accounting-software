<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>记账</title>
<style>
:root{--paper:#eef1f4;--card:#fbfcfd;--ink:#1d2a3a;--mute:#778594;--line:#d3dae1;--in:#2a7a68;--out:#c4472f;--acc:#24415f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.5 "Noto Sans CJK SC","Roboto",sans-serif}
button,input{font:inherit;color:inherit}
.num{font-family:"Noto Serif CJK SC","Noto Serif",Georgia,serif;font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:14px 20px 0}
.mon{display:flex;align-items:center;justify-content:space-between;font-size:16px}
.mon button{width:40px;height:40px;border:0;background:none;font-size:22px;color:var(--mute)}
.bal{text-align:center;padding:4px 0 14px;border-bottom:3px double var(--ink)}
.bal small{display:block;color:var(--mute);font-size:13px}
#bal{font-size:40px;line-height:1.2;font-weight:600;letter-spacing:.5px}
.io{display:flex;justify-content:space-around;margin-top:8px;font-size:14px}
.io b{font-weight:400;color:var(--mute);margin-right:6px}
#inc{color:var(--in)}#exp{color:var(--out)}
.tabs{display:flex;gap:24px;padding:10px 20px 0}
.tab{border:0;background:none;padding:6px 0;color:var(--mute);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-color:var(--ink);font-weight:600}
main{flex:1;overflow-y:auto;padding:0 20px 110px}
h3{display:flex;justify-content:space-between;margin:18px 0 4px;font-size:13px;font-weight:400;color:var(--mute)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row i{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-weight:600;flex:none}
i.out{background:#f6dfd9;color:var(--out)}i.in{background:#d6ebe5;color:var(--in)}
.m{flex:1;min-width:0}.m b{font-weight:500;display:block}
.m small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
span.out{color:var(--out)}span.in{color:var(--in)}
.empty{color:var(--mute);text-align:center;margin:48px 0}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden;margin:14px 0 4px}
.seg button{border:0;background:none;padding:5px 18px}
.seg button.on{background:var(--ink);color:var(--paper)}
.bar{margin:14px 0}.bh{display:flex;justify-content:space-between;margin-bottom:4px}
.bt{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bt div{height:100%;border-radius:4px}.bt .out{background:var(--out)}.bt .in{background:var(--in)}
.bk{margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
.bk p{margin:0 0 8px;color:var(--mute);font-size:13px}
textarea{width:100%;height:70px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px;font-size:12px;resize:none}
.btn{border:1px solid var(--ink);background:none;border-radius:8px;padding:6px 14px;margin:8px 8px 0 0}
#fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(22px + env(safe-area-inset-bottom,0px));border:0;background:var(--acc);color:#fff;border-radius:28px;padding:14px 26px;font-size:16px;box-shadow:0 4px 14px rgba(36,65,95,.35)}
#mask{position:fixed;inset:0;background:rgba(20,30,45,.45);opacity:0;pointer-events:none;transition:opacity .2s}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92%;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;padding:6px 20px 20px;transform:translateY(105%);transition:transform .22s}
.open #sheet{transform:none}.open #mask{opacity:1;pointer-events:auto}
#amt{width:100%;border:0;border-bottom:3px double var(--ink);background:none;font-size:36px;padding:6px 0;margin:10px 0;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:none;border-radius:16px;padding:4px 14px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.f{display:flex;gap:10px;margin-bottom:10px}
.f input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)}
.act{display:flex;gap:10px}
.act button{flex:1;border-radius:10px;padding:12px;border:1px solid var(--ink);background:none}
#ok{background:var(--acc);border-color:var(--acc);color:#fff;flex:2}
#del{color:var(--out);border-color:var(--out)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80%}
#toast.on{opacity:1}
</style></head><body>
<div id="app">
<header>
 <div class="mon"><button id="pv">‹</button><span id="ym"></span><button id="nx">›</button></div>
 <div class="bal"><small>本月结余</small><div id="bal" class="num"></div>
  <div class="io"><span><b>收入</b><span id="inc" class="num"></span></span><span><b>支出</b><span id="exp" class="num"></span></span></div></div>
</header>
<div class="tabs"><button class="tab" data-t="list">明细</button><button class="tab" data-t="stat">统计</button></div>
<main>
 <div id="list"></div>
 <div id="stat" hidden>
  <div class="seg" id="stseg"><button data-v="out">支出</button><button data-v="in">收入</button></div>
  <div id="bars"></div>
  <div class="bk"><p>数据只存在这台手机里。换手机或卸载前，先复制备份；在新手机上粘贴到下面再导入。</p>
   <textarea id="bk" placeholder="备份内容会出现在这里；导入时把备份粘贴到这里"></textarea>
   <button class="btn" id="bx">复制备份</button><button class="btn" id="bi">导入备份</button></div>
 </div>
</main>
<button id="fab">记一笔</button>
</div>
<div id="wrap"><div id="mask"></div>
<div id="sheet">
 <div class="seg" id="tseg"><button data-v="out">支出</button><button data-v="in">收入</button></div>
 <input id="amt" class="num" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
 <div class="chips" id="chips"></div>
 <div class="f"><input id="note" placeholder="备注（可不填）" maxlength="40"><input id="date" type="date"></div>
 <div class="act"><button id="del" hidden>删除</button><button id="ok">保存</button></div>
</div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const CAT={out:['餐饮','交通','购物','日用','房租','娱乐','医疗','学习','其他'],in:['工资','兼职','红包','其他']};
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=n=>n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=[],tab='list',stT='out',sT='out',sC=null,editId=null,delArm=0,tt;
let ym=new Date();ym=new Date(ym.getFullYear(),ym.getMonth(),1);
try{db=JSON.parse(localStorage.getItem('ledger.v1')||'[]')}catch(e){db=[]}
if(!Array.isArray(db))db=[];
function save(){try{localStorage.setItem('ledger.v1',JSON.stringify(db))}catch(e){toast('保存失败：这台手机的存储不可用')}}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1900)}
function render(){
 const p=ym.getFullYear()+'-'+pad(ym.getMonth()+1),rs=db.filter(r=>r.d.startsWith(p));let i=0,o=0;
 rs.forEach(r=>r.t==='in'?i+=r.a:o+=r.a);
 $('#ym').textContent=ym.getFullYear()+'年'+(ym.getMonth()+1)+'月';
 $('#bal').textContent=fmt((i-o)/100);$('#inc').textContent=fmt(i/100);$('#exp').textContent=fmt(o/100);
 $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('#list').hidden=tab!=='list';$('#stat').hidden=tab!=='stat';
 tab==='list'?rList(rs):rStat(rs);
}
function rList(rs){
 if(!rs.length){$('#list').innerHTML='<p class="empty">这个月还没有记录。点右下角「记一笔」开始。</p>';return}
 const g={},W='日一二三四五六';rs.forEach(r=>(g[r.d]=g[r.d]||[]).push(r));
 $('#list').innerHTML=Object.keys(g).sort().reverse().map(d=>{
  const dt=new Date(d+'T00:00:00');let di=0,dout=0;g[d].forEach(r=>r.t==='in'?di+=r.a:dout+=r.a);
  const sm=[dout?'支出 '+fmt(dout/100):'',di?'收入 '+fmt(di/100):''].filter(Boolean).join('　');
  return '<section><h3><span>'+(dt.getMonth()+1)+'月'+dt.getDate()+'日 周'+W[dt.getDay()]+'</span><span class="num">'+sm+'</span></h3>'+
  g[d].sort((a,b)=>b.id-a.id).map(r=>'<div class="row" data-id="'+r.id+'"><i class="'+r.t+'">'+esc(r.c.charAt(0))+'</i><div class="m"><b>'+esc(r.c)+'</b>'+(r.n?'<small>'+esc(r.n)+'</small>':'')+'</div><span class="num '+r.t+'">'+(r.t==='in'?'+':'−')+fmt(r.a/100)+'</span></div>').join('')+'</section>'}).join('');
}
function rStat(rs){
 const m={};let tot=0;rs.filter(r=>r.t===stT).forEach(r=>{m[r.c]=(m[r.c]||0)+r.a;tot+=r.a});
 const ks=Object.keys(m).sort((a,b)=>m[b]-m[a]);
 $('#bars').innerHTML=ks.length?ks.map(k=>{const p=m[k]/tot*100;return '<div class="bar"><div class="bh"><span>'+esc(k)+'</span><span class="num">'+fmt(m[k]/100)+'　'+p.toFixed(0)+'%</span></div><div class="bt"><div class="'+stT+'" style="width:'+p+'%"></div></div></div>'}).join(''):'<p class="empty">这个月没有'+(stT==='out'?'支出':'收入')+'记录。</p>';
 $$('#stseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===stT));
}
function setT(t,c){
 sT=t;sC=c&&CAT[t].includes(c)?c:CAT[t][0];
 $$('#tseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===t));
 $('#chips').innerHTML=CAT[t].map(k=>'<button class="chip'+(k===sC?' on':'')+'" data-c="'+k+'">'+k+'</button>').join('');
}
function openSheet(id){
 editId=id||null;delArm=0;const r=id?db.find(x=>x.id===id):null;
 $('#amt').value=r?r.a/100:'';$('#note').value=r?r.n:'';$('#date').value=r?r.d:ds(new Date());
 $('#del').hidden=!r;$('#del').textContent='删除';setT(r?r.t:'out',r&&r.c);
 $('#wrap').classList.add('open');if(!r)setTimeout(()=>$('#amt').focus(),250);
}
function closeSheet(){$('#wrap').classList.remove('open');$('#amt').blur();$('#note').blur()}
window.goBack=()=>{if($('#wrap').classList.contains('open')){closeSheet();return true}return false};
$('#fab').onclick=()=>openSheet();
$('#mask').onclick=closeSheet;
$('#list').onclick=e=>{const r=e.target.closest('.row');if(r)openSheet(+r.dataset.id)};
$('#tseg').onclick=e=>{const v=e.target.dataset.v;if(v)setT(v)};
$('#chips').onclick=e=>{const c=e.target.dataset.c;if(c)setT(sT,c)};
$('#stseg').onclick=e=>{const v=e.target.dataset.v;if(v){stT=v;render()}};
$$('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('#pv').onclick=()=>{ym=new Date(ym.getFullYear(),ym.getMonth()-1,1);render()};
$('#nx').onclick=()=>{ym=new Date(ym.getFullYear(),ym.getMonth()+1,1);render()};
$('#ok').onclick=()=>{
 const a=Math.round(parseFloat($('#amt').value)*100);
 if(!(a>0&&a<1e11)){toast('请输入大于 0 的金额');return}
 const d=$('#date').value||ds(new Date()),rec={t:sT,a:a,c:sC,n:$('#note').value.trim(),d:d};
 if(editId)Object.assign(db.find(x=>x.id===editId),rec);else{rec.id=Date.now();db.push(rec)}
 save();closeSheet();const p=d.split('-');ym=new Date(+p[0],+p[1]-1,1);render();toast('已保存');
};
$('#del').onclick=()=>{
 if(!delArm){delArm=1;$('#del').textContent='再点一次删除';setTimeout(()=>{delArm=0;$('#del').textContent='删除'},3000);return}
 db=db.filter(x=>x.id!==editId);save();closeSheet();render();toast('已删除');
};
$('#bx').onclick=()=>{
 const t=$('#bk');t.value=JSON.stringify(db);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 toast(ok?'已复制，共 '+db.length+' 条':'没能自动复制，请长按文本框全选后复制');
};
$('#bi').onclick=()=>{
 try{
  const a=JSON.parse($('#bk').value);if(!Array.isArray(a))throw 0;
  const ids=new Set(db.map(x=>x.id));let n=0;
  a.forEach(r=>{if(r&&r.id&&/^\d{4}-\d\d-\d\d$/.test(r.d)&&r.a>0&&(r.t==='in'||r.t==='out')&&!ids.has(r.id)){db.push({id:r.id,t:r.t,a:Math.round(r.a),c:String(r.c||'其他'),n:String(r.n||''),d:r.d});n++}});
  save();render();toast('导入了 '+n+' 条');
 }catch(e){toast('备份内容格式不对，请粘贴完整的备份')}
};
render();
</script></body></html>
